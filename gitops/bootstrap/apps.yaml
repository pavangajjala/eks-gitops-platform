# One Application per environment, generated from a list. Adding an
# environment is one more element here plus an overlay directory.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demo-api
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
            autoSync: "true"
          - env: prod
            autoSync: "false"
  template:
    metadata:
      name: "demo-api-{{ .env }}"
      labels:
        environment: "{{ .env }}"
    spec:
      project: apps
      source:
        repoURL: https://github.com/pavangajjala/eks-gitops-platform.git
        targetRevision: main
        path: "gitops/apps/demo-api/overlays/{{ .env }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "demo-{{ .env }}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=false
  # Dev syncs on every merge. Prod waits for someone to press Sync, which is
  # the promotion step.
  templatePatch: |
    {{- if eq .autoSync "true" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{- end }}
