# Two projects keep platform components and application teams apart:
# an application cannot create cluster-scoped resources or deploy outside
# its own namespaces, even if its manifests ask for it.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Cluster add-ons and policies owned by the platform team
  sourceRepos:
    - https://github.com/pavangajjala/eks-gitops-platform.git
    - https://charts.jetstack.io
    - https://kubernetes-sigs.github.io/metrics-server/
    - https://kyverno.github.io/kyverno/
    - https://charts.external-secrets.io
    - https://traefik.github.io/charts
    - https://prometheus-community.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
spec:
  description: Application workloads
  sourceRepos:
    - https://github.com/pavangajjala/eks-gitops-platform.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "demo-*"
  # Namespaces are the only cluster-scoped kind an application may create.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
