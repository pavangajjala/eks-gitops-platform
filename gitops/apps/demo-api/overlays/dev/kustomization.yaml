apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-dev

resources:
  - namespace.yaml
  - ../../base

images:
  - name: ghcr.io/stefanprodan/podinfo
    newTag: 6.7.1

patches:
  # One replica is enough in dev; the HPA floor has to drop with it.
  - target:
      kind: Deployment
      name: demo-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: demo-api
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
