apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-prod

resources:
  - namespace.yaml
  - ../../base

# Promotion to prod is a pull request that changes this tag.
images:
  - name: ghcr.io/stefanprodan/podinfo
    newTag: 6.7.1

patches:
  - target:
      kind: Deployment
      name: demo-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 200m, memory: 128Mi}
          limits: {memory: 256Mi}
      # In prod, refuse to stack replicas in one zone rather than tolerate it.
      - op: replace
        path: /spec/template/spec/topologySpreadConstraints/0/whenUnsatisfiable
        value: DoNotSchedule
  - target:
      kind: HorizontalPodAutoscaler
      name: demo-api
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 12
