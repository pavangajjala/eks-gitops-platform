apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.15.0
    helm:
      valuesObject:
        serviceAccount:
          name: external-secrets
          annotations:
            # Role created in terraform/cluster/irsa.tf; replace the account ID and cluster name.
            eks.amazonaws.com/role-arn: arn:aws:iam::222222222222:role/platform-dev-external-secrets
        resources:
          requests: {cpu: 20m, memory: 64Mi}
          limits: {memory: 128Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
